name: Calidad continua

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Cada lunes, para enterarse de vulnerabilidades nuevas aunque nadie haya hecho cambios.
    - cron: "17 12 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: sqlite:///ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run coverage run -m pytest
      - run: uv run coverage report

  dependencies:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Exactamente las versiones de uv.lock que corren en producción, con sus hashes.
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements-audit.txt
      - run: uvx pip-audit --requirement requirements-audit.txt --require-hashes --disable-pip --strict

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: betesda-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Vulnerabilidades críticas con parche disponible en la imagen (sistema y Python).
      # Las que aún no tienen arreglo no bloquean: no hay nada que actualizar todavía.
      - name: Escanear la imagen con Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.56.2 image --no-progress --scanners vuln
          --severity CRITICAL --ignore-unfixed --exit-code 1 betesda-web:ci

