name: Historia o mejora
description: Proponer una funcionalidad trazable al alcance.
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: input
    id: requirement
    attributes:
      label: Requerimiento relacionado
      placeholder: RF-01
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Historia de usuario
      placeholder: Como visitante, quiero..., para...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptacion
      placeholder: "- Dado... cuando... entonces..."
    validations:
      required: true

