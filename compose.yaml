name: betesda-web

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betesda}
      POSTGRES_USER: ${POSTGRES_USER:-betesda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betesda-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  web:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:

networks:
  frontend:
  backend:
    internal: true
