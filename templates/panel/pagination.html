{% if page_obj.paginator.num_pages > 1 %}
<nav class="p-pagination" aria-label="Páginas de resultados"><span>{{ page_obj.start_index }}–{{ page_obj.end_index }} de {{ page_obj.paginator.count }}</span><div>{% if page_obj.has_previous %}<a class="p-button p-button-small p-button-secondary" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}pagina={{ page_obj.previous_page_number }}" rel="prev">Anterior</a>{% endif %}<span class="p-pagination-current">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="p-button p-button-small p-button-secondary" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}pagina={{ page_obj.next_page_number }}" rel="next">Siguiente</a>{% endif %}</div></nav>
{% endif %}
