<article class="content-card">
  {% if post.cover_image %}<a class="content-card-image" href="{{ post.get_absolute_url }}"><img src="{{ post.cover_image.url }}" alt="{{ post.title }}" loading="lazy" width="640" height="360"></a>{% endif %}
  <div class="content-card-body">
    <p class="card-kicker">Noticias y anuncios · {{ post.published_at|date:'d M Y' }}</p>
    <h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
    <p>{{ post.excerpt }}</p>
    <a class="text-link" href="{{ post.get_absolute_url }}">Leer noticia {% include 'includes/icon.html' with name='arrow' %}</a>
  </div>
</article>
