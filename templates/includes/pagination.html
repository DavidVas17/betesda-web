{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Páginas de resultados">
    {% if page_obj.has_previous %}<a href="?pagina={{ page_obj.previous_page_number }}{% if past %}&amp;vista=anteriores{% endif %}">← Anterior</a>{% endif %}
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?pagina={{ page_obj.next_page_number }}{% if past %}&amp;vista=anteriores{% endif %}">Siguiente →</a>{% endif %}
  </nav>
{% endif %}
