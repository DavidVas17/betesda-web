name: betesda-web-prod

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
      COLLECT_STATIC: "true"
      RUN_MIGRATIONS: "true"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - frontend

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
